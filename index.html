<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Tracker</title>
<meta name="description" content="Personal weight, fasting, fitness and blood-work tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Health">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --card: #151515;
  --card-2: #1f1f1f;
  --line: #2b2b2b;
  --ink: #ffffff;
  --ink-2: #b8b8b8;
  --ink-3: #7c7c7c;
  --accent: #e8202f;
  --accent-press: #c41624;
  --accent-soft: rgba(232, 32, 47, .16);
  --good: #33d17a;
  --warn: #ffc533;
  --bad: #ff5a4a;
  --none: #8a8a8a;
  --radius: 16px;
  --num: "Barlow Condensed", "SF Pro Display", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 "Barlow", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
a { color: var(--ink); }
header.top {
  position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.88);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
header.top .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
header.top h1 { font-family: var(--num); font-size: 32px; font-weight: 800; margin: 0; line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; }
.icon-btn {
  border: 0; background: var(--card-2); color: var(--ink); width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
main { max-width: 640px; margin: 0 auto; padding: 6px 16px 24px; }
.card { background: var(--card); border-radius: var(--radius); padding: 18px 16px; margin: 0 0 14px; }
.card h2 {
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2);
  margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.card h2 small { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); font-size: 13px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: 14px; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; }
.hero { background: linear-gradient(160deg, #2a0a0e 0%, #151515 55%); border: 1px solid #3a1418; }
.hero .label { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.hero .big { font-family: var(--num); font-size: 64px; font-weight: 800; line-height: 1; margin: 6px 0 4px; }
.hero .big small { font-size: 24px; font-weight: 600; color: var(--ink-2); margin-left: 4px; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.lost { text-align: right; }
.lost .v { font-family: var(--num); font-size: 36px; font-weight: 800; color: var(--good); line-height: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.tile {
  background: var(--card); border-radius: var(--radius); padding: 14px; min-width: 0; text-align: left;
  border: 0; color: var(--ink); font: inherit; display: block; width: 100%; cursor: pointer;
}
.tile .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.tile .value { font-family: var(--num); font-size: 36px; font-weight: 800; line-height: 1.05; margin-top: 6px; white-space: nowrap; }
.tile .value small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.tile .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .bar { margin-top: 10px; }
.down { color: var(--good) !important; } .up { color: var(--warn) !important; }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.actions button {
  font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 14px; min-height: 60px; padding: 8px;
  background: var(--card-2); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.actions button svg { width: 22px; height: 22px; color: var(--accent); }
form .row { display: flex; gap: 10px; flex-wrap: wrap; }
form .row > label { flex: 1 1 130px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
input, select, textarea {
  display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 17px; color: var(--ink);
  background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 48px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
input[type="checkbox"] { width: 24px; height: 24px; min-height: 0; display: inline-block; margin: 0 10px 0 0; accent-color: var(--accent); flex: none; }
label.check { display: flex; align-items: center; color: var(--ink); font-size: 16px; font-weight: 500; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card-2); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 9px; min-height: 40px; background: none; color: var(--ink-2); cursor: pointer; letter-spacing: .04em; text-transform: uppercase; }
.seg button.on { background: var(--accent); color: #fff; }
button.btn {
  font: inherit; font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase;
  border: 0; border-radius: 999px; padding: 12px 20px; min-height: 52px;
  background: var(--accent); color: #fff; cursor: pointer;
}
button.btn:active { background: var(--accent-press); }
button.btn.secondary { background: var(--card-2); color: var(--ink); }
button.btn.ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line); }
button.btn.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--line); }
button.btn.small { min-height: 40px; padding: 8px 14px; font-size: 13px; }
button.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
details summary { cursor: pointer; font-weight: 700; color: var(--ink); list-style: none; min-height: 32px; display: flex; align-items: center; gap: 8px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "+"; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; flex: none; }
details[open] summary::before { content: "−"; }
details[open] summary { margin-bottom: 14px; }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
ul.list .grow { flex: 1; min-width: 0; }
ul.list .num { font-family: var(--num); font-size: 22px; font-weight: 700; white-space: nowrap; }
.x { border: 0; background: none; color: var(--ink-3); font-size: 22px; width: 36px; height: 40px; border-radius: 50%; cursor: pointer; flex: none; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); vertical-align: 1px; }
.tag.red { background: var(--accent-soft); color: #ff6b76; }
.tag.good { background: rgba(51,209,122,.15); color: var(--good); }
.bar { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.good > span { background: var(--good); }
.big { font-family: var(--num); font-size: 48px; font-weight: 800; line-height: 1.05; }
.big small { font-size: 20px; font-weight: 600; color: var(--ink-2); }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; top: 0; pointer-events: none; background: #fff; color: #000; font-size: 13px; padding: 7px 9px; border-radius: 9px; white-space: nowrap; transform: translateX(-50%); display: none; z-index: 2; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.lg-line { width: 16px; height: 3px; border-radius: 2px; background: var(--accent); }
.lg-dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.lg-ring { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-3); }
.lg-goal { width: 16px; border-top: 2px dotted var(--ink-2); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stats3 .tile .value { font-size: 30px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 10px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
th { color: var(--ink-3); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border-top: 0; }
td.v { font-family: var(--num); font-size: 19px; font-weight: 700; white-space: nowrap; }
.milestone { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.milestone:first-of-type { border-top: 0; }
.milestone .bar { grid-column: 1 / -1; }
.weeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 90px; margin-top: 10px; position: relative; }
.weeks .wk { background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.weeks .wk.hit { background: var(--good); }
.weeks-labels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 4px; }
.target-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--ink-3); }
.banner { background: var(--card-2); border-left: 4px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; color: var(--ink-2); }
.banner b { color: var(--ink); }
.banner.warn { border-left-color: var(--warn); }
code.url { display: block; word-break: break-all; background: var(--card-2); border-radius: 10px; padding: 10px; font-size: 13px; margin: 6px 0 12px; color: var(--ink-2); }
.locked { text-align: center; padding: 24px 16px; }
.locked .lock { font-size: 36px; }
/* lab status */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px 3px 7px; border-radius: 999px; white-space: nowrap; }
.st i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 11px; color: #000; }
.st.good { background: rgba(51,209,122,.14); color: var(--good); } .st.good i { background: var(--good); }
.st.warn { background: rgba(255,197,51,.14); color: var(--warn); } .st.warn i { background: var(--warn); }
.st.bad { background: rgba(255,90,74,.16); color: var(--bad); } .st.bad i { background: var(--bad); }
.st.none { background: var(--card-2); color: var(--ink-2); } .st.none i { background: var(--none); }
.lab-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.lab-row:first-of-type { border-top: 0; }
.lab-row .dot { width: 10px; align-self: stretch; border-radius: 6px; flex: none; }
.lab-row .dot.good { background: var(--good); } .lab-row .dot.warn { background: var(--warn); } .lab-row .dot.bad { background: var(--bad); } .lab-row .dot.none { background: var(--none); }
.lab-row .nm { font-weight: 700; font-size: 16px; }
.lab-row .val { font-family: var(--num); font-size: 26px; font-weight: 800; white-space: nowrap; text-align: right; line-height: 1; }
.lab-row .val small { font-family: "Barlow", sans-serif; font-size: 12px; font-weight: 500; color: var(--ink-3); display: block; margin-top: 3px; }
.lab-row .chev { color: var(--ink-3); font-size: 20px; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.counts div { background: var(--card); border-radius: var(--radius); padding: 12px; text-align: center; }
.counts b { display: block; font-family: var(--num); font-size: 34px; font-weight: 800; line-height: 1; }
.counts span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.counts .good b { color: var(--good); } .counts .warn b { color: var(--warn); } .counts .bad b { color: var(--bad); }
dl.gloss dt { font-weight: 700; margin-top: 12px; }
dl.gloss dd { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }
.bands { width: 100%; font-size: 14px; }
.bands td { padding: 7px 4px; }
.bands tr.me td { background: var(--card-2); }
.bands tr.me td:first-child { border-radius: 8px 0 0 8px; } .bands tr.me td:last-child { border-radius: 0 8px 8px 0; }
.src li { margin: 6px 0; font-size: 14px; }
.src a { color: var(--ink-2); }
/* bottom sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 30; display: none; }
.sheet-bg.open { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: #101010; border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .28s ease; max-width: 640px; margin: 0 auto; border-top: 1px solid var(--line);
}
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet h3 { font-family: var(--num); font-size: 30px; font-weight: 800; text-transform: uppercase; margin: 0; line-height: 1.1; }
.sheet h4 { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 20px 0 6px; }
.sheet p { margin: 0 0 8px; }
.sheet ul.tips { margin: 0; padding-left: 20px; } .sheet ul.tips li { margin: 5px 0; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(10,10,10,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  border: 0; background: none; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--ink-3); padding: 4px 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px;
}
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button.on { color: #fff; }
nav.tabs button.on svg { color: var(--accent); }
#toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: #fff; color: #000; font-weight: 600; padding: 11px 18px; border-radius: 999px; font-size: 15px; opacity: 0;
  transition: opacity .25s, transform .25s; pointer-events: none; z-index: 40; max-width: calc(100% - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 370px) { .tile .value { font-size: 30px; } .hero .big { font-size: 54px; } .stats3 .tile .value { font-size: 24px; } }
</style>
</head>
<body>
<header class="top">
  <div><div class="eyebrow" id="eyebrow"></div><h1 id="title">Home</h1></div>
  <button class="icon-btn" data-act="settings" aria-label="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetBg" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="dl"></div>

<script>
"use strict";
// =====================================================================
// Storage
// =====================================================================
const KEY = "healthTracker.v1";
const AREAS = { core: "Core", lower: "Lower body", upper: "Upper body" };
const DEFAULTS = {
  v: 3,
  settings: {
    heightIn: null, startWeight: 220, startDate: "2026-08-18", goals: [207, 205, 197],
    cardioTarget: 300, strengthTarget: 90, fastTarget: 16,
    // suggestions shown when logging; names you type in get added
    exercises: {
      core: ["Crunches", "Bicycle crunches", "Reverse crunches", "Dead bugs", "Bird dogs", "Leg raises", "Flutter kicks", "Russian twists", "Hollow hold", "Plank", "Side plank"],
      lower: ["Bodyweight squats", "Goblet squats", "Lunges", "Step-ups", "Glute bridges", "Hip thrusts", "Romanian deadlifts", "Leg press", "Leg curls", "Leg extensions", "Calf raises"],
      upper: ["Push-ups", "Bench press", "Dumbbell press", "Shoulder press", "Lateral raises", "Rows", "Lat pulldown", "Pull-ups", "Bicep curls", "Tricep extensions", "Chest fly"]
    },
    // exercise goals: {id, area, ex, sets, reps, sec, weight}
    liftGoals: [],
    shouldersCleared: false, clearedDate: null, lastBackup: null, lastSync: null
  },
  weights: [], meals: [], fasts: [], cheats: [], cardio: [], core: [], strength: [], labs: []
};
const LEGACY = ["planks", "pushups"]; // v2 collections, folded into core/strength by migrate()
// Readings you gave me to start with (lbs). Added once; never overwrite an existing reading.
const BACKFILL = [
  ["2026-08-18", 220.0, "other", "Starting weight, doctor's office"],
  ["2026-10-09", 215.6, "walk", ""],
  ["2026-10-16", 213.8, "wake", ""],
  ["2026-10-23", 211.6, "wake", ""],
  ["2026-10-25", 213.8, "wake", ""],
  ["2026-10-26", 209.8, "wake", ""],
  ["2026-10-27", 209.8, "wake", ""]
];
const TYPES = { wake: "Wake-up", walk: "Post-walk", other: "Other" };

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const db = JSON.parse(JSON.stringify(DEFAULTS));
  if (saved && typeof saved === "object") {
    for (const k of Object.keys(DEFAULTS).concat(LEGACY)) if ((Array.isArray(DEFAULTS[k]) || LEGACY.includes(k)) && Array.isArray(saved[k])) db[k] = saved[k];
    Object.assign(db.settings, saved.settings || {});
    db.v = saved.v || 1;
  } else db.v = 1;
  return migrate(db);
}
function migrate(db) {
  if (db.v < 2) {
    db.weights.forEach(w => { w.id = w.id || uid(); w.type = w.type || "wake"; });
    db.labs.forEach(l => { if (l.range == null) { l.range = l.note || ""; delete l.note; } });
    if (!db.settings.startWeight || db.settings.startWeight === 209) db.settings.startWeight = 220;
    db.settings.startDate = db.settings.startDate || "2026-08-18";
    db.v = 2;
  }
  if (db.v < 3) {
    const s = db.settings;
    s.cardioTarget = 300;
    for (const p of db.planks || []) db.core.push({ id: p.id || uid(), date: p.date, ex: "Plank", sets: 1, reps: null, sec: p.sec });
    for (const p of db.pushups || []) db.strength.push({ id: p.id || uid(), date: p.date, area: "upper", ex: "Push-ups", sets: 1, reps: p.reps, weight: null, min: null });

function handleSyncLink() {
  const p = new URLSearchParams(location.search);
  if (!p.has("w")) return;
  const w = num(p.get("w"));
  let bf = num(p.get("bf"));
  if (bf != null && bf > 0 && bf < 1) bf = bf * 100; // Health sometimes gives 0.241 for 24.1%
  const dm = (p.get("d") || "").match(/\d{4}-\d{2}-\d{2}/);
  const date = dm ? dm[0] : today();
  const type = TYPES[p.get("t")] ? p.get("t") : "wake";
  history.replaceState(null, "", location.pathname + location.hash);
  if (w == null || w < 50 || w > 700) { setTimeout(() => toast("Sync link had no usable weight"), 300); return; }
  const entry = { date, type, w: Math.round(w * 10) / 10, src: "health" };
  if (bf != null && bf > 0 && bf < 80) entry.bf = Math.round(bf * 10) / 10;
  const bmi = num(p.get("bmi")); if (bmi != null && bmi > 5 && bmi < 100) entry.bmi = Math.round(bmi * 10) / 10;
  const lean = num(p.get("lean")); if (lean != null && lean > 20 && lean < 500) entry.lean = Math.round(lean * 10) / 10;
  const mm = num(p.get("mm")); if (mm != null && mm > 20 && mm < 500) entry.muscle = Math.round(mm * 10) / 10;
  upsertWeight(entry);
  db.settings.lastSync = new Date().toISOString(); save();
  setTimeout(() => toast(`Synced ${r1(entry.w)} lb from Apple Health (${fmtD(date)})`), 300);
}

function smoothPath(P) {
  // monotone cubic (no overshoot) through screen points
  if (!P.length) return "";
  if (P.length < 3) return P.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");

  for (let i = 0; i < n - 1; i++) d[i] = (P[i + 1][1] - P[i][1]) / ((P[i + 1][0] - P[i][0]) || 1e-6);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  let path = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = P[i + 1][0] - P[i][0];
    path += `C${(P[i][0] + h / 3).toFixed(1)},${(P[i][1] + m[i] * h / 3).toFixed(1)} ${(P[i + 1][0] - h / 3).toFixed(1)},${(P[i + 1][1] - m[i + 1] * h / 3).toFixed(1)} ${P[i + 1][0].toFixed(1)},${P[i + 1][1].toFixed(1)}`;
  }
  return path;
}

  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); hl.setAttribute("visibility", "hidden"); };

function aggregate(keyFn, startFn) {
  // groups readings by period; wake-up average if any, else average of all readings (drawn hollow)
  const groups = {};
  for (const w of allWeights()) (groups[keyFn(w.date)] = groups[keyFn(w.date)] || []).push(w);
  return Object.keys(groups).sort().map(k => {
    const g = groups[k], wake = g.filter(w => w.type === "wake");
    const use = wake.length ? wake : g;
    return { key: k, t: tms(startFn(k)), y: mean(use.map(w => w.w)), n: use.length, hollow: !wake.length };
  });
}
function drawWeightCharts() {
  const s = db.settings, goals = [...s.goals].sort((a, b) => b - a), last = latest();

  if (el) {
    if (wView === "daily") {
      const from = addDays(today(), -29), all = allWeights().filter(w => w.date >= from), wake = trendWeights();
      const pts = all.map(w => ({ t: tms(w.date), y: w.w, hollow: w.type !== "wake",
        tip: `<b>${fmtD(w.date)}</b> · ${r1(w.w)} lb<br>${TYPES[w.type]}${w.note ? " · " + esc(w.note) : ""}${w.type === "wake" ? `<br>7-day avg ${r1(avg7(wake, w.date))}` : ""}` }));
      const line = wake.filter(w => w.date >= from).map(w => ({ t: tms(w.date), y: avg7(wake, w.date) }));
      drawChart(el, { points: pts, line, refs, label: "Daily weigh-ins with 7-day average" });
    } else if (wView === "weekly") {
      const agg = aggregate(weekStart, k => k);

const sumMin = (arr, from, to = "9999-12-31") => arr.filter(c => c.date >= from && c.date <= to).reduce((a, c) => a + (c.min || 0), 0);
function weekBars(arr, target) {
  const ws = weekStart(today()), weeks = [];
  for (let i = 7; i >= 0; i--) { const start = addDays(ws, -7 * i); weeks.push({ start, m: sumMin(arr, start, addDays(start, 6)) }); }
  const maxM = Math.max(target * 1.2, ...weeks.map(w => w.m));
  return `<div class="weeks"><div class="target-line" style="bottom:${target / maxM * 100}%"></div>
      ${weeks.map(w => `<div class="wk ${w.m >= target ? "hit" : ""}" style="height:${w.m / maxM * 100}%" title="${w.m} min"></div>`).join("")}</div>
    <div class="weeks-labels">${weeks.map(w => `<span>${w.m}<br>${fmtD(w.start)}</span>`).join("")}</div>`;
}
function weekHero(title, mins, target, form, list) {
  return `<div class="card hero"><h2>${title} <small>Mon–Sun</small></h2>
    <div class="big">${mins}<small> / ${target} min</small></div>
    <div class="faint" style="margin-bottom:12px">${mins >= target ? "Weekly target hit 🔥" : `${target - mins} min to go`}</div>
    <div class="bar ${mins >= target ? "good" : ""}"><span style="width:${Math.min(100, mins / target * 100)}%"></span></div>
    ${form}${list}</div>`;
}
function goalProgress(g) {
  const same = (g.area === "core" ? db.core : db.strength).filter(e => exKey(e.ex) === exKey(g.ex));
  const meets = e => (e.sets || 1) >= (g.sets || 1) && (!g.reps || (e.reps || 0) >= g.reps) && (!g.sec || (e.sec || 0) >= g.sec) && (!g.weight || (e.weight || 0) >= g.weight);
  const hit = same.filter(meets).sort((a, b) => a.date.localeCompare(b.date))[0] || null;
  const max = xs => Math.max(0, ...xs);
  let best, target, txt;
  if (g.weight) { best = max(same.filter(e => (e.reps || 0) >= (g.reps || 0)).map(e => e.weight || 0)); target = g.weight; txt = best ? `Best: ${nf(best)} lb for ${g.reps}+ reps` : "No sets at that rep count yet"; }
  else if (g.sec) { best = max(same.map(e => e.sec || 0)); target = g.sec; txt = best ? `Best hold: ${fmtSec(best)}` : "Not logged yet"; }
  else { best = max(same.map(e => e.reps || 0)); target = g.reps; txt = best ? `Best set: ${best} reps` : "Not logged yet"; }

  if (e.basis === "lab") basis = `Rated against <b>your lab's range (${esc(fmtRange(e.lab))} ${esc(last.unit)})</b>.`;
  else if (e.basis === "guide") basis = `Rated against the <b>general adult guideline</b> below.`;
  else if (e.basis === "typical") basis = `Rated against a <b>typical adult range (${t.typ[0]}–${t.typ[1]} ${esc(t.unit)})</b>. Labs vary — add your lab's range for the most accurate rating.`;
  else basis = t && t.note ? esc(t.note) : `No range to compare with yet. Add your lab's reference range to this result.`;
  const bands = t && t.bands ? `<h4>General adult guideline (${esc(t.unit)})</h4><table class="bands"><tbody>${t.bands.map(b =>
    `<tr class="${e.basis === "guide" && e.band === b ? "me" : ""}"><td>${esc(b[3])}</td><td>${stChip({ st: b[1], label: b[2] })}</td></tr>`).join("")}</tbody></table>
    ${e.basis === "lab" ? `<p class="faint" style="margin-top:6px">Your lab's range takes priority; this is shown for comparison.</p>` : ""}` : "";
  return `<div class="grab"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div><div class="faint" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:12px">${esc(t ? t.panel : "Lab result")}</div><h3>${esc(t ? t.name : last.name)}</h3></div>
      <button class="icon-btn" data-act="closeSheet" aria-label="Close">✕</button></div>
    <div style="display:flex;align-items:baseline;gap:10px;margin:10px 0 6px"><span class="big">${esc(last.value)}</span><span class="muted">${esc(last.unit)}</span></div>
    <div>${stChip(e)} <span class="faint">· ${fmtDY(last.date)}</span></div>
    <p class="muted" style="margin-top:10px">${basis}</p>
    ${bands}
    ${arr.length >= 2 ? `<h4>Your results over time</h4><div class="chart" id="labChart"></div>` : ""}
    <table style="margin-top:6px"><tbody>${[...arr].reverse().map(l => { const le = evalLab(l);
      return `<tr><td>${fmtDY(l.date)}${l === arr[0] && arr.length > 1 ? ' <span class="tag">Baseline</span>' : ""}</td><td class="v">${esc(l.value)}</td><td>${stChip(le)}</td><td class="faint">${l.range ? "lab: " + esc(l.range) : ""}</td><td><button class="x" data-act="edit" data-k="labs" data-id="${esc(l.id)}" aria-label="Edit">✎</button></td></tr>`; }).join("")}</tbody></table>
    ${t ? `<h4>What it measures</h4><p>${esc(t.what)}</p>
      <h4>If it's high</h4><p>${esc(t.high)}</p>
      <h4>If it's low</h4><p>${esc(t.low)}</p>
      <h4>Commonly recommended habits</h4><ul class="tips">${t.tips.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <h4>Sources</h4><ul class="src" style="padding-left:18px;margin:0">${t.src.map(k => `<li><a href="${S[k][1]}" target="_blank" rel="noopener">${esc(S[k][0])}</a></li>`).join("")}</ul>`
      : `<p class="faint" style="margin-top:14px">This test isn't in the built-in library yet, so there's no explainer. Try <a href="${S.medLabs[1]}" target="_blank" rel="noopener">MedlinePlus Lab Tests</a>.</p>`}
    <div style="margin-top:18px">${DISCLAIMER}</div>`;
}
function renderSheet() {
  const sh = $("#sheet"), bg = $("#sheetBg");
  const html = editing ? editSheet() : openLab && current === "labs" ? labSheet(openLab) : "";
  if (!html) { openLab = null; editing = null; sh.classList.remove("open"); bg.classList.remove("open"); return; }
  sh.innerHTML = html;
  sh.classList.add("open"); bg.classList.add("open");
  if (editing) { sh.scrollTop = 0; return; }
  const ch = $("#labChart", sh);
  if (ch) {
    const arr = labGroups()[openLab].filter(l => num(l.value) != null);
    const e = evalLab(arr[arr.length - 1]);
    const r = e.lab || (e.t && e.t.typ ? { lo: e.t.typ[0], hi: e.t.typ[1] } : null);
    const refs = r ? [r.lo, r.hi].filter(v => v != null).map(v => ({ y: v, label: String(v) })) : [];
    requestAnimationFrame(() => drawChart(ch, { points: arr.map(l => ({ t: tms(l.date), y: num(l.value), tip: `<b>${fmtDY(l.date)}</b> · ${esc(l.value)} ${esc(l.unit)}` })),
      line: arr.map(l => ({ t: tms(l.date), y: num(l.value) })), refs, height: 180, label: "Results over time", xfmt: d => fmtDY(d) }));
  }
}

// =====================================================================
// Settings
// =====================================================================
function viewSettings() {
  const s = db.settings;
  const appUrl = location.origin + location.pathname;
  const ft = s.heightIn ? Math.floor(s.heightIn / 12) : "", inch = s.heightIn ? Math.round(s.heightIn % 12) : "";
  const nUpper = s.liftGoals.filter(g => g.area === "upper").length;
  const backupAge = s.lastBackup ? Math.floor((Date.now() - new Date(s.lastBackup)) / 864e5) : null;
  return `
  ${navigator.standalone ? `<div class="banner warn"><b>Heads up:</b> you opened the home-screen web-app version. iPhone keeps its data separate from Safari's, and the Apple Health Shortcut opens Safari. Use the Shortcut as your home-screen icon instead (see the setup guide).</div>` : ""}
  <div class="card"><h2>Apple Health sync</h2>
    <p class="muted" style="margin-top:0">Your iPhone Shortcut opens this address with your latest numbers attached (saved as a wake-up reading):</p>
    <code class="url">${esc(appUrl)}?w=…&amp;bf=…&amp;bmi=…&amp;lean=…&amp;d=…</code>
    <div class="btn-row"><button class="btn secondary small" data-act="copyUrl">Copy app address</button>
    <button class="btn ghost small" data-act="testSync">Test with sample data</button></div>
    <p class="faint">${s.lastSync ? "Last sync: " + fmtDT(s.lastSync) : "No syncs yet."}</p>
  </div>
  <div class="card"><h2>Profile & goals</h2>
    <form data-form="settings">
      <div class="row">
        <label>Starting weight (lb)<input type="number" name="startWeight" step="0.1" value="${s.startWeight ?? ""}" inputmode="decimal"></label>
        <label>Start date<input type="date" name="startDate" value="${s.startDate || ""}"></label>
      </div>
      <div class="row">
        <label>Height (ft)<input type="number" name="ft" min="3" max="8" value="${ft}" inputmode="numeric" placeholder="5"></label>
        <label>Height (in)<input type="number" name="in" min="0" max="11" value="${inch}" inputmode="numeric" placeholder="10"></label>
      </div>
      <label>Goal weights (lb, comma separated — the lowest is maintenance)<input name="goals" value="${s.goals.join(", ")}"></label>
      <div class="row">
        <label>Cardio min / week<input type="number" name="cardioTarget" min="10" value="${s.cardioTarget}" inputmode="numeric"></label>
        <label>Strength min / week<input type="number" name="strengthTarget" min="10" value="${s.strengthTarget}" inputmode="numeric"></label>
      </div>
      <div class="row">
        <label>Fast goal (hours)<input type="number" name="fastTarget" min="8" max="72" value="${s.fastTarget}" inputmode="numeric"></label>
      </div>
      <label class="check"><input type="checkbox" name="shouldersCleared" ${s.shouldersCleared ? "checked" : ""}>PT has cleared my shoulders for upper-body work</label>
      <button class="btn block" style="margin-top:12px">Save settings</button>
    </form>
  </div>
  <div class="card"><h2>Exercise goals <small>core &amp; strength</small></h2>
    ${goalList(s.liftGoals.filter(g => g.area !== "upper" || s.shouldersCleared)) || `<p class="faint">No exercise goals yet.</p>`}
    ${!s.shouldersCleared && nUpper ? `<p class="faint">🔒 ${nUpper} upper-body goal${nUpper === 1 ? "" : "s"} can be edited once your PT clears your shoulders.</p>` : ""}
    <details style="margin-top:12px"><summary>Add a goal</summary>
      <form data-form="add" data-k="liftGoals">${specFields("liftGoals", { area: "lower", sets: 3 })}
        <p class="faint" style="margin-top:-4px">A goal is met by one logged entry with at least these sets and reps (and weight or hold time, if set).</p>
        <button class="btn block">Add goal</button></form></details>
  </div>
  <div class="card"><h2>My exercises</h2>
    <p class="faint" style="margin-top:0">Suggestions when you log, one per line. Anything new you type while logging is added here automatically.</p>
    <form data-form="exlists">${Object.keys(AREAS).map(a => `<label>${AREAS[a]}${a === "upper" && !s.shouldersCleared ? " 🔒" : ""}<textarea name="${a}" rows="5">${esc(s.exercises[a].join("\n"))}</textarea></label>`).join("")}
      <button class="btn secondary block">Save exercise lists</button></form>
  </div>
  <div class="card"><h2>Backup</h2>
    <p class="muted" style="margin-top:0">Your data lives only on this phone, in Safari. Save a backup file now and then (to Files or iCloud Drive) so you never lose it.</p>
    ${backupAge == null || backupAge > 14 ? `<div class="banner warn">${backupAge == null ? "You haven't made a backup yet." : `Last backup was ${backupAge} days ago.`}</div>` : `<p class="faint">Last backup ${backupAge === 0 ? "today" : backupAge + " days ago"}.</p>`}
    <div class="btn-row"><button class="btn" data-act="export">Save backup</button>
    <label class="btn ghost" style="margin:0;display:inline-flex;align-items:center;border-radius:999px;padding:0 20px;min-height:52px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);cursor:pointer">Restore<input type="file" accept=".json,application/json" data-act="import" style="display:none"></label></div>
  </div>
  <div class="card"><h2>Danger zone</h2>
    <button class="btn danger" data-act="wipe">Erase all data on this device</button></div>
  <p class="faint" style="text-align:center"><a href="#" data-tab="home">← Back to dashboard</a></p>`;
}

// =====================================================================
// Actions
// =====================================================================
const forms = {
  weight(f) {
    const w = num(f.get("w")); if (w == null) return;
    const e = { date: f.get("date"), type: f.get("type") || "wake", w, bf: num(f.get("bf")), muscle: num(f.get("muscle")), bmi: num(f.get("bmi")), note: f.get("note").trim(), src: "manual" };
    if (e.bmi == null && bmiFor(w) != null) e.bmi = Math.round(bmiFor(w) * 10) / 10;
    upsertWeight(e); toast("Weigh-in saved");
  },
  meal(f) { db.meals.push({ id: uid(), date: f.get("date"), time: f.get("time"), text: f.get("text").trim(), cheat: !!f.get("cheat") }); save(); toast("Meal saved"); },
  cheat(f) { db.cheats.push({ id: uid(), date: f.get("date"), text: f.get("text").trim(), done: false }); save(); toast("Cheat meal planned"); },
  fast(f) {
    const start = new Date(f.get("start")), endV = f.get("end");
    const end = endV ? new Date(endV) : null;
    if (end && end <= start) return alert("The end time needs to be after the start time.");
    if (!end && db.fasts.some(x => !x.end)) return alert("You already have a fast running.");
    db.fasts.push({ id: uid(), start: start.toISOString(), end: end ? end.toISOString() : null }); save(); toast(end ? "Fast logged" : "Fast started");
  },
  endFastAt(f) {
    const a = db.fasts.find(x => !x.end), end = new Date(f.get("end"));
    if (!a) return; if (end <= new Date(a.start)) return alert("The end time needs to be after the start time.");
    a.end = end.toISOString(); save(); toast("Fast ended: " + fmtDur(end - new Date(a.start)));
  },
  edit(f) {
    const { k, id } = editing || {}, item = k && coll(k).find(x => String(x.id) === id);
    if (!item) { editing = null; return; }
    const e = readSpec(k, f), err = SPEC[k].check && SPEC[k].check(e, item);
    if (err) { alert(err); return false; }
    Object.assign(item, e); editing = null; save(); toast("Changes saved");
  },
  exlists(f) {
    for (const a of Object.keys(AREAS)) {
      const seen = new Set();
      db.settings.exercises[a] = String(f.get(a) || "").split("\n").map(x => x.trim()).filter(x => x && !seen.has(exKey(x)) && seen.add(exKey(x)));
    }
    save(); toast("Exercise lists saved");
  },
  lab(f) {
    const name = f.get("name").trim(), t = findTest(name);
    const l = { id: uid(), date: f.get("date"), name: t ? t.name : name, value: f.get("value").trim(), unit: f.get("unit").trim() || (t ? t.unit : ""), range: f.get("range").trim() };
    db.labs.push(l); save();
    toast(`${l.name} saved — ${evalLab(l).label}`);
  },
  settings(f) {
    const s = db.settings, ft = num(f.get("ft")), inch = num(f.get("in"));
    s.heightIn = ft ? ft * 12 + (inch || 0) : null;
    s.startWeight = num(f.get("startWeight")) || s.startWeight;
    s.startDate = f.get("startDate") || s.startDate;
    const goals = String(f.get("goals")).split(/[,\s]+/).map(num).filter(g => g != null && g > 50);
    if (goals.length) s.goals = [...new Set(goals)].sort((a, b) => b - a);
    for (const k of ["cardioTarget", "strengthTarget", "fastTarget"]) { const v = num(f.get(k)); if (v) s[k] = v; }
    const cleared = !!f.get("shouldersCleared");
    if (cleared && !s.shouldersCleared) s.clearedDate = today();
    s.shouldersCleared = cleared;
    save(); toast("Settings saved");
  }
};
document.addEventListener("submit", e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const ok = form.dataset.form === "add" ? addEntry(form.dataset.k, fd) : forms[form.dataset.form](fd);
  if (ok !== false) render();
});
const syncExList = el => { const ex = el.name === "area" && el.form && el.form.elements.ex; if (ex) ex.setAttribute("list", "dl-" + el.value); };
document.addEventListener("input", e => {
  syncExList(e.target);
  if (e.target.name === "name" && e.target.closest("form[data-form=lab]")) {
    const t = findTest(e.target.value), u = e.target.form.elements.unit;
    if (t && !u.value) u.value = t.unit;
  }
});
document.addEventListener("change", e => {
  syncExList(e.target);
  if (e.target.dataset.act !== "import") return;
  const file = e.target.files[0]; if (!file) return;
  file.text().then(txt => {
    const data = JSON.parse(txt);
    if (!data || !Array.isArray(data.weights)) throw new Error("not a Health Tracker backup");
    if (!confirm("Replace everything on this device with the backup file?")) return;
    localStorage.setItem(KEY, JSON.stringify(data)); db = load(); save(); render(); toast("Backup restored");
  }).catch(err => alert("Couldn't read that file: " + err.message));
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (openLab || editing)) { if (editing) editing = null; else openLab = null; renderSheet(); } });
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { e.preventDefault(); openLab = null; editing = null; if (tabBtn.dataset.fv) fView = tabBtn.dataset.fv; go(tabBtn.dataset.tab); return; }
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  const act = el.dataset.act;
  if (act === "settings") { e.preventDefault(); openLab = null; editing = null; go(current === "settings" ? "home" : "settings"); return; }
  if (act === "quick") { if (el.dataset.fv) fView = el.dataset.fv; go(el.dataset.go, el.dataset.focus); return; }
  if (act === "wview") { wView = el.dataset.v; render(); return; }
  if (act === "fview") { fView = el.dataset.v; render(); return; }
  if (act === "edit") { editing = { k: el.dataset.k, id: el.dataset.id }; renderSheet(); return; }
  if (act === "openLab") { openLab = el.dataset.k; renderSheet(); return; }
  if (act === "closeSheet") { if (editing) editing = null; else openLab = null; renderSheet(); return; }
  if (act === "del") {
    if (!confirm("Delete this entry?")) return;
    setColl(el.dataset.k, coll(el.dataset.k).filter(x => String(x.id) !== el.dataset.id));
    if (editing && editing.id === el.dataset.id) editing = null;
    save(); render(); return;
  }
  if (act === "startFast") { db.fasts.push({ id: uid(), start: new Date().toISOString(), end: null }); save(); toast("Fast started — you've got this"); render(); return; }
  if (act === "endFast") { const a = db.fasts.find(x => !x.end); if (a) { a.end = new Date().toISOString(); save(); toast("Fast ended: " + fmtDur(new Date(a.end) - new Date(a.start))); } render(); return; }
  if (act === "cancelFast") { if (confirm("Cancel this fast without saving it?")) { db.fasts = db.fasts.filter(x => x.end); save(); render(); } return; }
  if (act === "cheatDone") {
    const c = db.cheats.find(x => x.id === el.dataset.id);
    if (c) { c.done = true; db.meals.push({ id: uid(), date: c.date > today() ? today() : c.date, time: "19:00", text: c.text, cheat: true }); save(); toast("Enjoyed! Logged as a cheat meal"); }
    render(); return;
  }
  if (act === "clearShoulders") {
    if (confirm("Has your physical therapist cleared you for push-ups and upper-body work?")) { db.settings.shouldersCleared = true; db.settings.clearedDate = today(); save(); toast("Upper-body exercises unlocked 💪"); render(); }
    return;
  }
  if (act === "copyUrl") {
    const u = location.origin + location.pathname;
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Copied: " + u), () => prompt("Copy this address:", u));
    return;
  }
  if (act === "testSync") { location.href = location.pathname + "?w=208.6&bf=24.1&bmi=29.1&lean=158.3&d=" + today(); return; }
  if (act === "export") {
    db.settings.lastBackup = new Date().toISOString(); save();
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `health-tracker-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    render(); return;
  }
  if (act === "wipe") {
    if (confirm("Erase ALL your data on this device? This can't be undone.") && confirm("Really erase everything?")) {
      localStorage.removeItem(KEY); db = load(); db.weights = []; save(); render(); toast("All data erased");
    }
  }
});

// keep timers fresh; redraw charts on rotation
const busy = () => document.activeElement && document.activeElement.closest("form");
setInterval(() => { if ((current === "food" || current === "home") && db.fasts.some(f => !f.end) && !busy() && !openLab && !editing) render(); }, 30000);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (current === "weight") drawWeightCharts(); if (openLab && !editing) renderSheet(); }, 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy() && !editing) render(); });

handleSyncLink();
render();
</script>
</body>
</html>
