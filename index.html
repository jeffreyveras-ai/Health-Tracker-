<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Momentum</title>
<meta name="description" content="Personal weight, fasting, fitness and blood-work tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="theme-color" content="#0F1114">
<script>try { if (localStorage.getItem("healthTracker.v1.theme") === "navy") document.documentElement.dataset.theme = "navy"; } catch (e) {}</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Momentum "Dark" (default) */
  color-scheme: dark;
  --bg: #0F1114;
  --card: #2E3136;
  --card-2: #1F2226;
  --line: #4A4F57;
  --ink: #F4F6F8;
  --ink-2: #C4C9D0;
  --ink-3: #ADB3BC;
  --accent: #C5F36B;
  --accent-rgb: 197, 243, 107;
  --accent-text: #C5F36B;
  --on-accent: #0F1114;
  --accent-press: #B0DE52;
  --accent-soft: rgba(var(--accent-rgb), .14);
  --good: #4FD1C5;
  --good-soft: rgba(79, 209, 197, .15);
  --warn: #F2C14E;
  --warn-soft: rgba(242, 193, 78, .15);
  --bad: #FFA24C;
  --bad-soft: rgba(255, 162, 76, .16);
  --none: #8B929C;
  --hero-top: #353B2E;
  --hero-border: #4A5536;
  --sheet: #1A1D21;
  --header-bg: rgba(15, 17, 20, .9);
  --bar-bg: rgba(20, 22, 26, .96);
  --chart-grid: #3A3E45;
  --radius: 16px;
  --num: "Barlow Condensed", "SF Pro Display", system-ui, sans-serif;
}
html[data-theme="navy"] {
  /* Momentum "Navy" */
  --bg: #101B2D;
  --card: #243651;
  --card-2: #192A43;
  --line: #3E5577;
  --ink: #F5F8FC;
  --ink-2: #C8D3E2;
  --ink-3: #B3C1D4;
  --accent: #55B8FF;
  --accent-rgb: 85, 184, 255;
  --accent-text: #9AD3FF;
  --on-accent: #0B1626;
  --accent-press: #3DA6F2;
  --none: #8FA0B8;
  --hero-top: #253F61;
  --hero-border: #2F5682;
  --sheet: #152338;
  --header-bg: rgba(16, 27, 45, .9);
  --bar-bg: rgba(18, 30, 50, .96);
  --chart-grid: #34496B;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body.setup nav.tabs, body.setup header.top .icon-btn { display: none; }
.streak { display: flex; align-items: center; gap: 14px; }
.streak svg { width: 44px; height: 44px; flex: none; }
.streak .v { font-family: var(--num); font-size: 40px; font-weight: 800; line-height: 1; }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.mgrid .n { font-size: 24px; font-weight: 800; line-height: 1.1; }
.mgrid .faint { font-size: 12px; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 "Barlow", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
a { color: var(--ink); }
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--header-bg);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
header.top .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
header.top .logo { width: 44px; height: 44px; flex: none; border-radius: 11px; box-shadow: 0 0 0 1px var(--line); }
header.top .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
header.top h1 { font-family: var(--num); font-size: 32px; font-weight: 800; margin: 0; line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; }
.icon-btn {
  border: 0; background: var(--card-2); color: var(--ink); width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
main { max-width: 640px; margin: 0 auto; padding: 6px 16px 24px; }
.card { background: var(--card); border-radius: var(--radius); padding: 18px 16px; margin: 0 0 14px; }
.card h2 {
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2);
  margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.card h2 small { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); font-size: 13px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: 14px; }
.n { font-family: var(--num); font-variant-numeric: tabular-nums; }
.hero { background: linear-gradient(160deg, var(--hero-top) 0%, var(--card) 60%); border: 1px solid var(--hero-border); }
.hero .label { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.hero .big { font-family: var(--num); font-size: 64px; font-weight: 800; line-height: 1; margin: 6px 0 4px; }
.hero .big small { font-size: 24px; font-weight: 600; color: var(--ink-2); margin-left: 4px; }
.hero-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.lost { text-align: right; }
.lost .v { font-family: var(--num); font-size: 36px; font-weight: 800; color: var(--good); line-height: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.tile {
  background: var(--card); border-radius: var(--radius); padding: 14px; min-width: 0; text-align: left;
  border: 0; color: var(--ink); font: inherit; display: block; width: 100%; cursor: pointer;
}
.tile .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.tile .value { font-family: var(--num); font-size: 36px; font-weight: 800; line-height: 1.05; margin-top: 6px; white-space: nowrap; }
.tile .value small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.tile .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .bar { margin-top: 10px; }
.down { color: var(--good) !important; } .up { color: var(--warn) !important; }
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.actions button {
  font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 14px; min-height: 60px; padding: 8px;
  background: var(--card-2); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.actions button svg { width: 22px; height: 22px; color: var(--accent); }
form .row { display: flex; gap: 10px; flex-wrap: wrap; }
form .row > label { flex: 1 1 130px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }
input, select, textarea {
  display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 17px; color: var(--ink);
  background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 48px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
input[type="checkbox"] { width: 24px; height: 24px; min-height: 0; display: inline-block; margin: 0 10px 0 0; accent-color: var(--accent); flex: none; }
label.check { display: flex; align-items: center; color: var(--ink); font-size: 16px; font-weight: 500; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card-2); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 9px; min-height: 40px; background: none; color: var(--ink-2); cursor: pointer; letter-spacing: .04em; text-transform: uppercase; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
button.btn {
  font: inherit; font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase;
  border: 0; border-radius: 999px; padding: 12px 20px; min-height: 52px;
  background: var(--accent); color: var(--on-accent); cursor: pointer;
}
button.btn:active { background: var(--accent-press); }
button.btn.secondary { background: var(--card-2); color: var(--ink); }
button.btn.ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1.5px var(--line); }
button.btn.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--line); }
button.btn.small { min-height: 40px; padding: 8px 14px; font-size: 13px; }
button.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
details summary { cursor: pointer; font-weight: 700; color: var(--ink); list-style: none; min-height: 32px; display: flex; align-items: center; gap: 8px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "+"; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 800; flex: none; }
details[open] summary::before { content: "−"; }
details[open] summary { margin-bottom: 14px; }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
ul.list .grow { flex: 1; min-width: 0; }
ul.list .num { font-family: var(--num); font-size: 22px; font-weight: 700; white-space: nowrap; }
.x { border: 0; background: none; color: var(--ink-3); font-size: 22px; width: 36px; height: 40px; border-radius: 50%; cursor: pointer; flex: none; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--ink-2); vertical-align: 1px; }
.tag.red { background: var(--accent-soft); color: var(--accent-text); }
.tag.good { background: var(--good-soft); color: var(--good); }
.bar { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.good > span { background: var(--good); }
.big { font-family: var(--num); font-size: 48px; font-weight: 800; line-height: 1.05; }
.big small { font-size: 20px; font-weight: 600; color: var(--ink-2); }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 7px 9px; border-radius: 9px; white-space: nowrap; transform: translateX(-50%); display: none; z-index: 2; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 6px; }
.lg-line { width: 16px; height: 3px; border-radius: 2px; background: var(--accent); }
.lg-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
.lg-ring { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--ink-3); }
.lg-goal { width: 16px; border-top: 2px dotted var(--ink-2); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stats3 .tile .value { font-size: 30px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 10px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
th { color: var(--ink-3); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; border-top: 0; }
td.v { font-family: var(--num); font-size: 19px; font-weight: 700; white-space: nowrap; }
.milestone { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.milestone:first-of-type { border-top: 0; }
.milestone .bar { grid-column: 1 / -1; }
.weeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 90px; margin-top: 10px; position: relative; }
.weeks .wk { background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.weeks .wk.hit { background: var(--good); }
.weeks-labels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 4px; }
.target-line { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--ink-3); }
.banner { background: var(--card-2); border-left: 4px solid var(--accent); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; color: var(--ink-2); }
.banner b { color: var(--ink); }
.banner.warn { border-left-color: var(--warn); }
code.url { display: block; word-break: break-all; background: var(--card-2); border-radius: 10px; padding: 10px; font-size: 13px; margin: 6px 0 12px; color: var(--ink-2); }
.locked { text-align: center; padding: 24px 16px; }
.locked .lock { font-size: 36px; }
/* lab status */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px 3px 7px; border-radius: 999px; white-space: nowrap; }
.st i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 11px; color: var(--bg); }
.st.good { background: var(--good-soft); color: var(--good); } .st.good i { background: var(--good); }
.st.warn { background: var(--warn-soft); color: var(--warn); } .st.warn i { background: var(--warn); }
.st.bad { background: var(--bad-soft); color: var(--bad); } .st.bad i { background: var(--bad); }
.st.none { background: var(--card-2); color: var(--ink-2); } .st.none i { background: var(--none); }
.lab-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.lab-row:first-of-type { border-top: 0; }
.lab-row .dot { width: 10px; align-self: stretch; border-radius: 6px; flex: none; }
.lab-row .dot.good { background: var(--good); } .lab-row .dot.warn { background: var(--warn); } .lab-row .dot.bad { background: var(--bad); } .lab-row .dot.none { background: var(--none); }
.lab-row .nm { font-weight: 700; font-size: 16px; }
.lab-row .val { font-family: var(--num); font-size: 26px; font-weight: 800; white-space: nowrap; text-align: right; line-height: 1; }
.lab-row .val small { font-family: "Barlow", sans-serif; font-size: 12px; font-weight: 500; color: var(--ink-3); display: block; margin-top: 3px; }
.lab-row .chev { color: var(--ink-3); font-size: 20px; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.counts div { background: var(--card); border-radius: var(--radius); padding: 12px; text-align: center; }
.counts b { display: block; font-family: var(--num); font-size: 34px; font-weight: 800; line-height: 1; }
.counts span { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.counts .good b { color: var(--good); } .counts .warn b { color: var(--warn); } .counts .bad b { color: var(--bad); }
dl.gloss dt { font-weight: 700; margin-top: 12px; }
dl.gloss dd { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; }
.bands { width: 100%; font-size: 14px; }
.bands td { padding: 7px 4px; }
.bands tr.me td { background: var(--card-2); }
.bands tr.me td:first-child { border-radius: 8px 0 0 8px; } .bands tr.me td:last-child { border-radius: 0 8px 8px 0; }
.src li { margin: 6px 0; font-size: 14px; }
.src a { color: var(--ink-2); }
/* bottom sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 30; display: none; }
.sheet-bg.open { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--sheet); border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .28s ease; max-width: 640px; margin: 0 auto; border-top: 1px solid var(--line);
}
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
.sheet h3 { font-family: var(--num); font-size: 30px; font-weight: 800; text-transform: uppercase; margin: 0; line-height: 1.1; }
.sheet h4 { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 20px 0 6px; }
.sheet p { margin: 0 0 8px; }
.sheet ul.tips { margin: 0; padding-left: 20px; } .sheet ul.tips li { margin: 5px 0; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--bar-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  border: 0; background: none; font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--ink-3); padding: 4px 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px;
}
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on svg { color: var(--accent); }
#toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); font-weight: 600; padding: 11px 18px; border-radius: 999px; font-size: 15px; opacity: 0;
  transition: opacity .25s, transform .25s; pointer-events: none; z-index: 40; max-width: calc(100% - 32px); text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.frow { background: var(--card-2); border-radius: 12px; padding: 10px 12px 0; margin-top: 10px; }
.frow.unmatched { box-shadow: inset 0 0 0 1.5px var(--warn); }
.frow input, .frow select { background: var(--card); }
.frow-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.row.tight > label { flex: 1 1 80px; }
.ftotal { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 12px; }
.chip { border: 0; border-radius: 999px; background: var(--card-2); color: var(--ink); padding: 8px 14px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--on-accent); }
.pick-list { display: grid; gap: 8px; }
.theme-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme-opt { border: 2px solid; border-radius: 14px; padding: 12px; text-align: left; font: inherit; cursor: pointer; display: grid; gap: 4px; }
.theme-opt .sw { display: block; height: 34px; border-radius: 8px; position: relative; margin-bottom: 4px; }
.theme-opt .sw i { position: absolute; left: 8px; right: 40%; top: 13px; height: 8px; border-radius: 4px; }
.theme-opt small { font-weight: 700; }
.tagline { font-family: var(--num); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-text); font-size: 15px; margin: 2px 0 10px; }
.days { display: grid; gap: 10px; margin-top: 14px; }
.day-card { background: var(--card-2); border-radius: 14px; padding: 12px 14px; border: 1.5px solid transparent; }
.day-card.today { border-color: var(--accent); background: linear-gradient(160deg, var(--hero-top), var(--card-2) 70%); }
.day-card.rest { opacity: .78; } .day-card.done { box-shadow: inset 4px 0 0 var(--good); }
.day-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 14px; }
.day-title { font-family: var(--num); font-size: 22px; font-weight: 800; text-transform: uppercase; margin: 2px 0 4px; }
.day-cardio { font-size: 15px; margin: 4px 0; } .day-items { margin: 6px 0 0; padding-left: 18px; font-size: 15px; } .day-items li { margin: 4px 0; }
.day-done { color: var(--good); font-weight: 700; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.src-tag { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 0 4px; vertical-align: 1px; }
button.link { border: 0; background: none; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }

<script>

const LEGACY = ["planks", "pushups"]; // v2 collections, folded into core/strength by migrate()
const TYPES = { wake: "Wake-up", walk: "Post-walk", other: "Other" };

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const db = JSON.parse(JSON.stringify(DEFAULTS));
  if (saved && typeof saved === "object") {
    for (const k of Object.keys(DEFAULTS).concat(LEGACY)) if ((Array.isArray(DEFAULTS[k]) || LEGACY.includes(k)) && Array.isArray(saved[k])) db[k] = saved[k];
    Object.assign(db.settings, saved.settings || {});
    db.v = saved.v || 1;

  } else db.v = 3; // brand-new: nothing to migrate from older versions

}
function migrate(db, hadSaved) {
  if (db.v < 2) {
    db.weights.forEach(w => { w.id = w.id || uid(); w.type = w.type || "wake"; });
    db.labs.forEach(l => { if (l.range == null) { l.range = l.note || ""; delete l.note; } });

  if (db.v < 3) {
    const s = db.settings;

    for (const p of db.planks || []) db.core.push({ id: p.id || uid(), date: p.date, ex: "Plank", sets: 1, reps: null, sec: p.sec });

    if (!s.liftGoals.length) s.liftGoals = [
      { id: uid(), area: "core", ex: "Plank", sets: 1, reps: null, sec: s.plankGoal || 60, weight: null },
      { id: uid(), area: "upper", ex: "Push-ups", sets: 1, reps: s.pushupGoal || 25, sec: null, weight: null }
    ];
    delete db.planks; delete db.pushups; delete s.plankGoal; delete s.pushupGoal;
    db.v = 3;
  }

    if (hadSaved) db.settings.setupDone = true;
  }
  if (db.v < 6 && hadSaved && db.settings.shouldersCleared === false && !db.settings.lockModeSet) {

    if (!db.foods.length) db.foods = FOOD_TABLE.map(([name, serving, amt, unit, cal, protein, aliases]) => ({ id: uid(), name, serving, amt, unit, cal, protein, aliases, src: "table" }));
  }
  db.v = DEFAULTS.v;
  const ex = JSON.parse(JSON.stringify(DEFAULTS.settings.exercises));
  for (const a of Object.keys(AREAS)) if (db.settings.exercises && Array.isArray(db.settings.exercises[a])) ex[a] = db.settings.exercises[a];

  if (!Array.isArray(db.settings.liftGoals)) db.settings.liftGoals = [];

  catch (e) { alert("Couldn't save on this device: " + e.message); }
}

// =====================================================================
// Helpers
// =====================================================================
const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  if (v == null) return null;
  const s = String(v).replace(",", ".").replace(/[^0-9.\-]/g, "");

  const n = parseFloat(s);
  return isNaN(n) ? null : n;
};

const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2800);
}

let db = load(); save();
const THEMES = { dark: { name: "Dark", bg: "#0F1114", card: "#2E3136", accent: "#C5F36B" }, navy: { name: "Navy", bg: "#101B2D", card: "#243651", accent: "#55B8FF" } };

  const t = THEMES[db.settings.theme] ? db.settings.theme : "dark";
  if (t === "navy") document.documentElement.dataset.theme = "navy"; else delete document.documentElement.dataset.theme;

// =====================================================================
// Weight math
// =====================================================================
const byDate = (a, b) => a.date.localeCompare(b.date) || (a.type === "wake" ? -1 : 1);

  return mean(ws.filter(w => w.date >= start && w.date <= endDate).map(w => w.w));

  const end = addDays(ws0, 6);

  const i = db.weights.findIndex(w => w.date === entry.date && w.type === entry.type);
  if (i >= 0) {

// =====================================================================

// =====================================================================

// Workout fields: wt (type), wm (minutes), wc (calories), whr (average heart rate). Empty values are skipped.
function healthWorkoutType(t) {

function smoothPath(P) {
  // monotone cubic (no overshoot) through screen points
  if (!P.length) return "";
  if (P.length < 3) return P.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");

  for (let i = 0; i < n - 1; i++) d[i] = (P[i + 1][1] - P[i][1]) / ((P[i + 1][0] - P[i][0]) || 1e-6);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  let path = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = P[i + 1][0] - P[i][0];
    path += `C${(P[i][0] + h / 3).toFixed(1)},${(P[i][1] + m[i] * h / 3).toFixed(1)} ${(P[i + 1][0] - h / 3).toFixed(1)},${(P[i + 1][1] - m[i + 1] * h / 3).toFixed(1)} ${P[i + 1][0].toFixed(1)},${P[i + 1][1].toFixed(1)}`;
  }
  return path;
}

  });

    o.points.forEach((p, i) => { const d = Math.abs(sx(p.t) - px); if (d < bd) { bd = d; best = i; } });
    const p = o.points[best], cx = sx(p.t);

    hl.setAttribute("cx", cx); hl.setAttribute("cy", sy(p.y)); hl.setAttribute("visibility", "visible");
    tip.innerHTML = p.tip; tip.style.display = "block";
    const left = cx * rect.width / W, half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(left, half), rect.width - half) + "px";
    tip.style.top = Math.max(-8, sy(p.y) * rect.height / H - tip.offsetHeight - 14) + "px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); hl.setAttribute("visibility", "hidden"); };
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerleave", hide);

    <li><div class="grow"><b>Labs &amp; blood work</b><div class="faint">Your lab results, what they mean, and where the ranges come from</div></div><button class="btn secondary small" data-tab="labs">Open</button></li></ul></div>
  <p class="faint" style="text-align:center"><a href="#" data-tab="home">← Back to dashboard</a></p>`;
}

// =====================================================================
// Actions
// =====================================================================
const forms = {
  quickAdd: () => qaSave(),
  ...coachForms,
  ...scanForms,
  weight(f) {
    const w = num(f.get("w")); if (w == null) return;
    const e = { date: f.get("date"), type: f.get("type") || "wake", w, bf: num(f.get("bf")), muscle: num(f.get("muscle")), bmi: num(f.get("bmi")), note: f.get("note").trim(), src: "manual" };
    if (e.bmi == null && bmiFor(w) != null) e.bmi = Math.round(bmiFor(w) * 10) / 10;
    upsertWeight(e); toast("Weigh-in saved"); maybeRecap(e.date);
  },
  meal: () => saveMeal(),
  fast(f) {
    const start = new Date(f.get("start")), endV = f.get("end");
    const end = endV ? new Date(endV) : null;
    if (end && end <= start) return alert("The end time needs to be after the start time.");
    if (!end && db.fasts.some(x => !x.end)) return alert("You already have a fast running.");
    db.fasts.push({ id: uid(), start: start.toISOString(), end: end ? end.toISOString() : null }); save(); toast(end ? "Fast logged" : "Fast started");
  },
  endFastAt(f) {
    const a = db.fasts.find(x => !x.end), end = new Date(f.get("end"));
    if (!a) return; if (end <= new Date(a.start)) return alert("The end time needs to be after the start time.");
    a.end = end.toISOString(); save(); toast("Fast ended: " + fmtDur(end - new Date(a.start)));
  },
  edit(f) {
    const { k, id } = editing || {}, item = k && coll(k).find(x => String(x.id) === id);
    if (!item) { editing = null; return; }
    const e = readSpec(k, f), err = SPEC[k].check && SPEC[k].check(e, item);
    if (err) { alert(err); return false; }
    Object.assign(item, e); editing = null; save(); toast("Changes saved");
  },
  setup(f) {
    const s = db.settings, sw = num(f.get("startWeight"));
    const goals = String(f.get("goals")).split(/[,\s]+/).map(num).filter(g => g != null && g > 50 && g < 700);
    if (sw == null || sw < 50 || sw > 700) { alert("Enter your starting weight in pounds."); return false; }
    if (!goals.length) { alert("Enter at least one goal weight in pounds."); return false; }
    s.name = String(f.get("name") || "").trim(); s.startWeight = sw; s.startDate = f.get("startDate") || today();
    const ft = num(f.get("ft")), inch = num(f.get("in"));
    if (ft) s.heightIn = ft * 12 + (inch || 0);
    if (num(f.get("age"))) s.age = num(f.get("age"));
    s.sex = f.get("sex") === "female" ? "female" : "male";
    s.weighDay = f.get("weighDay") != null ? +f.get("weighDay") : 5;
    s.goals = [...new Set(goals)].sort((a, b) => b - a);
    s.shouldersCleared = f.get("injury") === "no"; if (!s.shouldersCleared) s.lockMode = f.get("injury"); s.lockModeSet = true;
    if (!db.weights.length) db.weights.push({ id: uid(), date: s.startDate, w: sw, type: "other", note: "Starting weight", src: "manual" });
    s.setupDone = true; save(); current = "home";
    toast(s.name ? `Welcome, ${s.name}!` : "You're all set");
  },
  exlists(f) {
    for (const a of Object.keys(AREAS)) {
      const seen = new Set();
      db.settings.exercises[a] = String(f.get(a) || "").split("\n").map(x => x.trim()).filter(x => x && !seen.has(exKey(x)) && seen.add(exKey(x)));
    }
    save(); toast("Exercise lists saved");
  },
  lab(f) {
    const name = f.get("name").trim(), t = findTest(name);
    const l = { id: uid(), date: f.get("date"), name: t ? t.name : name, value: f.get("value").trim(), unit: f.get("unit").trim() || (t ? t.unit : ""), range: f.get("range").trim() };
    db.labs.push(l); save();
    toast(`${l.name} saved — ${evalLab(l).label}`);
  },
  settings(f) {
    const s = db.settings, ft = num(f.get("ft")), inch = num(f.get("in"));
    s.heightIn = ft ? ft * 12 + (inch || 0) : null;
    s.name = String(f.get("name") || "").trim();
    s.startWeight = num(f.get("startWeight")) || s.startWeight;
    s.startDate = f.get("startDate") || s.startDate;
    const goals = String(f.get("goals")).split(/[,\s]+/).map(num).filter(g => g != null && g > 50);
    if (goals.length) s.goals = [...new Set(goals)].sort((a, b) => b - a);
    for (const k of ["cardioTarget", "strengthTarget", "fastTarget", "proteinTarget"]) { const v = num(f.get(k)); if (v) s[k] = v; }
    for (const k of ["age", "burnOverride"]) s[k] = num(f.get(k)) || null;
    s.sex = f.get("sex") === "female" ? "female" : "male";
    if (f.get("weighDay") != null) s.weighDay = +f.get("weighDay");
    const lm = f.get("lockMode") || lockMode(), cleared = lm === "off";
    if (cleared && !s.shouldersCleared) s.clearedDate = today();
    s.shouldersCleared = cleared; if (!cleared) s.lockMode = lm; s.lockModeSet = true;
    save(); toast("Settings saved");
  }
};
document.addEventListener("submit", e => {
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const ok = form.dataset.form === "add" ? addEntry(form.dataset.k, fd) : forms[form.dataset.form](fd);
  if (ok !== false) render();
});
const syncExList = el => { if ((el.name === "type" || el.name === "where") && el.form) syncCardioForm(el.form); const ex = el.name === "area" && el.form && el.form.elements.ex; if (ex) ex.setAttribute("list", "dl-" + el.value); };
document.addEventListener("input", e => {
  syncExList(e.target);
  if (qaInput(e.target)) return;
  if (draftInput(e.target)) return;
  if (e.target.name === "name" && e.target.closest("form[data-form=lab]")) {
    const t = findTest(e.target.value), u = e.target.form.elements.unit;
    if (t && !u.value) u.value = t.unit;
  }
});
document.addEventListener("change", e => {
  syncExList(e.target);
  if (e.target.id === "bodyMetric") { bMetric = e.target.value; render(); return; }
  if (e.target.id === "compMetric") { cMetric = e.target.value; render(); return; }
  if (e.target.type === "checkbox" && e.target.dataset.draft) { draftInput(e.target); return; }
  if (e.target.dataset.act !== "import") return;
  const file = e.target.files[0]; if (!file) return;
  e.target.value = "";
  file.text().then(txt => {
    const data = JSON.parse(txt);
    if (!data || typeof data !== "object" || !Array.isArray(data.weights)) throw new Error("it isn't a Momentum backup");
    const n = k => Array.isArray(data[k]) ? data[k].length : 0;
    const made = data.exportedAt ? ` from ${fmtDT(data.exportedAt)}` : "";
    if (!confirm(`Restore this backup${made}?\n\n${n("weights")} weigh-ins, ${n("meals")} meals, ${n("cardio") + n("strength") + n("core")} workouts, ${n("labs")} lab results.\n\nIt replaces everything currently on this device (a safety copy of the current data is kept).`)) return;
    try { localStorage.setItem(KEY + ".before-restore", JSON.stringify(db)); } catch (err) {}
    localStorage.setItem(KEY, JSON.stringify(data)); db = load(); save(); applyTheme(); current = "home"; render(); toast("Backup restored");
  }).catch(err => alert("Couldn't restore that file: " + err.message));
});
document.addEventListener("toggle", e => { if (e.target.id === "mealForm") mealFormOpen = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.qa === "desc") { e.preventDefault(); e.target.blur(); return; }
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.draft === "q") { e.preventDefault(); $("[data-act=offSearch]").click(); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".foldable > h2")) { e.preventDefault(); toggleCard(e.target); }
  if (e.key === "Escape" && $("#scanner")) { stopScan(); return; }
  if (e.key === "Escape" && $("#recap")) { $("[data-act=closeRecap]").click(); return; }
  if (e.key === "Escape" && openGuide && !editing) { openGuide = null; renderSheet(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (openLab || editing)) { if (editing) editing = null; else openLab = null; renderSheet(); } });
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { e.preventDefault(); openLab = null; editing = null; openGuide = null; logCardio = null; if (tabBtn.dataset.fv) fView = tabBtn.dataset.fv; go(tabBtn.dataset.tab); return; }
  const ct = e.target.closest(".foldable > h2"); if (ct && !e.target.closest("a, button, select, input")) { toggleCard(ct); return; }
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  const act = el.dataset.act;
  if (act === "settings") { e.preventDefault(); openLab = null; editing = null; go(current === "settings" ? "home" : "settings"); return; }
  if (act === "quick") { if (el.dataset.fv) fView = el.dataset.fv; if (el.dataset.focus === "cardioForm") { go(el.dataset.go); logCardio = { step: "group" }; renderSheet(); return; } go(el.dataset.go, el.dataset.focus); return; }
  if (act === "wview") { wView = el.dataset.v; render(); return; }
  if (act === "fview") { fView = el.dataset.v; render(); return; }
  if (act === "estimate") {
    if (!draft.text.trim()) { toast("Type what you ate first"); return; }
    // keep rows you already fixed up when their text hasn't changed
    const prev = draft.rows.filter(r => r.src === "text");
    draft.rows = draft.rows.filter(r => r.src !== "text").concat(parseMeal(draft.text).map(r => {
      const i = prev.findIndex(p => p.text === r.text); return i >= 0 ? prev.splice(i, 1)[0] : r; }));
    refreshDraft();
    const bad = draft.rows.filter(r => !r.foodId && !r.custom).length;
    if (bad) toast(`${bad} item${bad === 1 ? "" : "s"} need a food picked`);
    return;
  }
  if (act === "rmRow") { draft.rows.splice(+el.dataset.i, 1); refreshDraft(); return; }
  if (act === "clearDraft") { draft = newDraft(); render(); return; }
  if (act === "addPreset") {
    const p = db.presets.find(x => x.id === el.dataset.id); if (!p) return;
    draft.rows.push(...presetRows(p)); if (!draft.text.trim()) draft.text = p.name; mealFormOpen = true;
    if (current === "food") { render(); $("#draft").scrollIntoView({ block: "center" }); } else go("food", "mealForm");
    toast(`Added ${p.name} — review and save`); return;
  }
  if (act === "offSearch") {
    const q = draft.q.trim(); if (!q) { toast("Type a product name or barcode"); return; }
    draft.searching = true; refreshDraft();
    offSearch(q).then(r => { draft.results = r; }, err => { draft.results = `Couldn't reach Open Food Facts (${err.message}). Check your connection and try again.`; })
      .finally(() => { draft.searching = false; refreshDraft(); });
    return;
  }
  if (act === "offPick") {
    const f = draft.results && draft.results[+el.dataset.i]; if (!f) return;
    let food = db.foods.find(x => x.src === "off" && f.code && x.code === f.code);
    if (!food) { food = { id: uid(), ...f }; db.foods.push(food); save(); }
    draft.rows.push(calcRow({ text: food.name, src: "off", foodId: food.id, servings: 1 }));
    refreshDraft(); toast("Added — adjust servings if needed"); return;
  }
  if (act === "edit") { editing = { k: el.dataset.k, id: el.dataset.id }; renderSheet(); return; }
  if (act === "openLab") { openLab = el.dataset.k; renderSheet(); return; }
  if (act === "closeSheet") { if (editing) editing = null; else if (logCardio) logCardio = null; else if (openScan) openScan = null; else if (openGuide) openGuide = null; else openLab = null; renderSheet(); return; }
  if (act === "guide") { openGuide = el.dataset.id; renderSheet(); return; }
  if (act === "coachSel") { coachSel = coachSel === el.dataset.id ? null : el.dataset.id; render(); window.scrollTo(0, 0); return; }
  if (act === "planDone") { completeDay(el.dataset.g, el.dataset.w, +el.dataset.i); const d = coach().goals[el.dataset.g].weeks[el.dataset.w].days[+el.dataset.i]; toast(`Logged ${d.title.toLowerCase()} — ≈ ${dayKcal(d)} cal`); render(); return; }
  if (act === "planUndo") { undoDay(el.dataset.g, el.dataset.w, +el.dataset.i); toast("Removed from your log"); render(); return; }
  if (act === "planPdf") { sharePdf(el.dataset.g, el.dataset.scope); return; }
  if (act === "coachStop") { if (confirm("Stop this goal and delete its test history?")) { delete coach().goals[el.dataset.id]; save(); coachSel = null; render(); } return; }
  if (act === "scanStart") { startScan(); return; }
  if (act === "compAdd") { const d = $("#logComp"); if (d) { d.open = true; d.scrollIntoView({ block: "center", behavior: "smooth" }); const i = $("#logComp [name=bf]"); if (i) setTimeout(() => i.focus({ preventScroll: true }), 300); } return; }
  if (act === "logCardio") { logCardio = { step: "group" }; renderSheet(); return; }
  if (act === "logGroup") { logCardio = { step: "act", g: +el.dataset.g }; renderSheet(); return; }
  if (act === "logAct") { logCardio = { step: "form", g: logCardio && logCardio.g, type: el.dataset.v }; renderSheet(); const m = $("#sheet [name=min]"); if (m) m.focus({ preventScroll: true }); return; }
  if (act === "logStep") { logCardio = el.dataset.step === "act" ? { step: "act", g: logCardio.g } : { step: "group" }; renderSheet(); return; }
  if (act === "scanClose") { stopScan(); return; }
  if (act === "qaSlot") { qa.slot = el.dataset.v; qa.slotTouched = true; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); return; }
  if (act === "draftSlot") { draft.slot = el.dataset.v; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); return; }
  if (act === "qaPick") {
    const x = el.dataset.src === "local" ? qa.local[+el.dataset.i] : Array.isArray(qa.results) && qa.results[+el.dataset.i]; if (!x) return;
    qa.food = { kind: x.kind || "off", id: x.id, name: x.name, serving: x.serving, cal: x.cal, protein: x.protein, off: el.dataset.src === "off" ? x : null };
    qa.desc = x.name; qa.servings = 1; qa.cal = String(x.cal); qa.protein = String(x.protein); qa.msg = null; qa.nudged = false;
    qaSetInput("desc", qa.desc); qaSetInput("cal", qa.cal); qaSetInput("protein", qa.protein); qaRefresh(); return;
  }
  if (act === "qaClear") { qa.food = null; qa.cal = ""; qa.protein = ""; qaSetInput("cal", ""); qaSetInput("protein", ""); qa.local = qaLocal(qa.desc); qaRefresh(); return; }
  if (act === "qaAsk") {
    const text = `Estimate the calories and protein for this meal: ${qa.desc.trim() || "(see the attached photo)"}. If I attached a photo, use it to judge portion size. Reply only in this format: Calories: X, Protein: Yg`;
    copyText(text).then(ok => {
      qa.msg = ok ? { kind: "ok", text: "Prompt copied. Paste it into your AI app (Gemini, ChatGPT, Claude), add a photo, then come back." } : { kind: "copy", text };
      qaRefresh(); if (ok) toast("Prompt copied");
    });
    return;
  }
  if (act === "qaPaste") {
    let p = null;
    try { p = navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : null; } catch (err) {}
    if (!p) { qa.paste = true; qa.msg = { kind: "warn", text: "Paste the AI reply into the box below." }; qaRefresh(); return; }
    p.then(txt => { if (txt && txt.trim()) qaApplyReply(txt); else { qa.paste = true; qa.msg = { kind: "warn", text: "The clipboard looks empty — copy the AI's reply, or paste it into the box below." }; qaRefresh(); } },
      () => { qa.paste = true; qa.msg = { kind: "warn", text: "Couldn't read the clipboard here — press and hold in the box below, tap Paste, then Use this reply." }; qaRefresh(); });
    return;
  }
  if (act === "qaPasteBox") { const ta = $("[data-qa-paste]"); qaApplyReply(ta ? ta.value : ""); return; }
  if (act === "qaSaveMine") {
    const sv = qaSaved; if (!sv) return;
    if (!db.presets.some(p => exKey(p.name) === exKey(sv.name))) db.presets.push({ id: uid(), name: sv.name, items: [{ foodId: null, name: sv.name, servings: 1, cal: sv.cal || 0, protein: sv.protein || 0 }] });
    save(); toast(`“${sv.name}” saved to My Foods`); render(); return;
  }
  if (act === "qaDismiss") { qaSaved = null; qaRefresh(); return; }
  if (act === "saveAnyway") { draft.force = true; const f = $("form[data-form=meal]"); if (f) f.requestSubmit(); return; }
  if (act === "theme") { db.settings.theme = el.dataset.v; save(); applyTheme(); render(); toast(`${THEMES[el.dataset.v].name} theme on`); return; }
  if (act === "browserOk") { browserOk = true; try { localStorage.setItem(KEY + ".browserOk", "1"); } catch (err) {} render(); return; }
  if (act === "closeRecap") { const r = $("#recap"); if (r) { r.classList.remove("show"); setTimeout(() => r.remove(), 250); } return; }
  if (act === "recap") { showRecap(el.dataset.d); return; }
  if (act === "del") {
    if (!confirm("Delete this entry?")) return;
    setColl(el.dataset.k, coll(el.dataset.k).filter(x => String(x.id) !== el.dataset.id));
    if (editing && editing.id === el.dataset.id) editing = null;
    save(); render(); return;
  }
  if (act === "startFast") { db.fasts.push({ id: uid(), start: new Date().toISOString(), end: null }); save(); toast("Fast started — you've got this"); render(); return; }
  if (act === "endFast") { const a = db.fasts.find(x => !x.end); if (a) { a.end = new Date().toISOString(); save(); toast("Fast ended: " + fmtDur(new Date(a.end) - new Date(a.start))); } render(); return; }
  if (act === "cancelFast") { if (confirm("Cancel this fast without saving it?")) { db.fasts = db.fasts.filter(x => x.end); save(); render(); } return; }
  if (act === "clearShoulders") {
    if (confirm("Has your physical therapist or doctor cleared you for push-ups and upper-body work?")) { db.settings.shouldersCleared = true; db.settings.clearedDate = today(); save(); toast("Upper-body exercises unlocked 💪"); render(); }
    return;
  }
  if (act === "copyUrl") {
    const u = location.origin + location.pathname;
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Copied: " + u), () => prompt("Copy this address:", u));
    return;
  }
  if (act === "testSync") { location.href = location.pathname + "?w=208.6&bf=24.1&bmi=29.1&lean=158.3&d=" + today(); return; }
  if (act === "export") { exportBackup(); return; }
  if (act === "clipSync") { clipboardSync(); return; }
  if (act === "wipe") {
    if (confirm("Erase ALL your data on this device? This can't be undone.") && confirm("Really erase everything?")) {
      localStorage.removeItem(KEY); db = load(); db.weights = []; save(); render(); toast("All data erased");
    }
  }
});

// keep timers fresh; redraw charts on rotation
const busy = () => document.activeElement && document.activeElement.closest("form");
setInterval(() => { if ((current === "food" || current === "home") && db.fasts.some(f => !f.end) && !busy() && !openLab && !editing) render(); }, 30000);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (current === "weight") drawWeightCharts(); if (openLab && !editing) renderSheet(); }, 150); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy() && !editing) render(); });

handleSyncLink();
render();
</script>
